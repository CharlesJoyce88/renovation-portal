<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>98 Woodlawn Renovation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2ECDF;--surface:#FBF8F1;--ink:#2A2620;--muted:#6B6253;--line:#D8CDB8;--chip:#E9E0CE;
  --accent:#A8844F;--accent-ink:#2A2620;--blue:#365C49;--good:#4D7650;--bad:#963A2D;
  --green:#2E4A3B;--on-green:#F6F0E2;--header:#25392E;--header-ink:#EFE7D4;--header-muted:#B8C2B2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161A17;--surface:#1E231F;--ink:#ECE5D5;--muted:#A69D8B;--line:#363D36;--chip:#2A302B;
    --accent:#C5A26B;--blue:#9EC3AD;--good:#8FBC8F;--bad:#E3907F;
    --green:#3F634F;--on-green:#F6F0E2;--header:#111512;--header-ink:#ECE5D5;--header-muted:#9DA897;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161A17;--surface:#1E231F;--ink:#ECE5D5;--muted:#A69D8B;--line:#363D36;--chip:#2A302B;
  --accent:#C5A26B;--blue:#9EC3AD;--good:#8FBC8F;--bad:#E3907F;
  --green:#3F634F;--on-green:#F6F0E2;--header:#111512;--header-ink:#ECE5D5;--header-muted:#9DA897;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 "Libre Caslon Text",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
h1,h2,h3{font-family:"Libre Caslon Display","Libre Caslon Text",Georgia,"Times New Roman",serif;font-weight:400;margin:0;line-height:1.15}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:"Libre Caslon Display","Libre Caslon Text",Georgia,"Times New Roman",serif;font-weight:400;font-size:22px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-size:14px;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:6px -16px 0;padding:0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 10px 11px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-size:12px;color:var(--muted);margin-left:4px}

main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
.banner{background:var(--chip);border-left:4px solid var(--accent);padding:10px 14px;margin-bottom:16px;font-size:15px}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.viewhead h2{font-size:34px;font-weight:700}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--blue);padding-left:4px;padding-right:4px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--muted)}
.card h3{font-size:21px;font-weight:600}
.meta{color:var(--muted);font-size:14px}
.amount{font-family:"Libre Caslon Display","Libre Caslon Text",Georgia,"Times New Roman",serif;font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:13px;padding:1px 8px;border-radius:20px;background:var(--chip);color:var(--ink);white-space:nowrap}
.badge.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.notes{margin:8px 0 0;white-space:pre-wrap;font-size:15px}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.file{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;text-decoration:none;color:var(--ink);background:var(--paper);max-width:100%}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:6px;margin-top:10px;border:1px solid var(--line);display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{border:2px dashed var(--line);border-radius:8px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:6px}
.empty .row{justify-content:center;margin-top:14px}
.group{margin-bottom:22px}
.group > h3{font-size:22px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}

/* Overview */
.hero{display:grid;gap:18px;margin-bottom:22px}
.hero h1{font-size:clamp(40px,8vw,72px);font-weight:700;letter-spacing:-.01em}
.hero .addr{color:var(--muted);font-size:18px;margin-top:6px}
.budgetbar{height:28px;display:flex;border-radius:4px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.budgetbar i{display:block;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:15px}
.legend div{display:flex;flex-direction:column}
.legend b{font-family:"Libre Caslon Display","Libre Caslon Text",Georgia,"Times New Roman",serif;font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.ov{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ov h3{font-size:22px;margin-bottom:8px}
.ov ul{list-style:none;margin:0;padding:0}
.ov li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.ov li:first-child{border-top:0}
.ov li button{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}

/* Gantt */
.gantt{display:grid;grid-template-columns:minmax(120px,190px) 1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.g-labels{border-right:1px solid var(--line)}
.g-labels .g-h,.g-canvas .g-h{height:46px;border-bottom:1px solid var(--line)}
.g-label{height:40px;display:flex;flex-direction:column;justify-content:center;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.g-label b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label small{color:var(--muted);font-size:12px;line-height:1.2}
.g-scroll{overflow-x:auto}
.g-canvas{position:relative}
.g-month{position:absolute;top:4px;font-size:13px;font-weight:600;white-space:nowrap;padding-left:4px;border-left:1px solid var(--line)}
.g-week{position:absolute;top:24px;font-size:11px;color:var(--muted);padding-left:3px}
.g-row{height:40px;border-bottom:1px solid var(--line);position:relative}
.g-bar{position:absolute;top:9px;height:22px;border-radius:4px;cursor:pointer;border:0;padding:0;overflow:hidden;min-width:6px}
.g-bar i{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.28)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2}
.g-today span{position:absolute;top:2px;left:4px;font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:0 4px;border-radius:3px;white-space:nowrap}
.g-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.g-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--paper)}
td.n,th.n{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--paper)}
tfoot td{font-weight:600;border-bottom:0;background:var(--paper)}
.neg{color:var(--bad)}.pos{color:var(--good)}

/* Modal */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:92vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,16,.55)}
@media (max-width:640px){dialog{margin:auto 0 0;max-width:100%;border-radius:14px 14px 0 0;max-height:94vh}}
.m-head{position:sticky;top:0;background:var(--surface);padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:1}
.m-head h2{font-size:26px}
.m-body{padding:14px 18px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
.m-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 2}
.f.half{grid-column:span 1}
@media (max-width:420px){.f.half{grid-column:span 2}}
.f label{font-size:14px;font-weight:500;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 10px;width:100%}
.f textarea{min-height:96px;resize:vertical}
.uploading{font-size:14px;color:var(--muted)}
.err{color:var(--bad);font-size:14px}
.auth{max-width:440px;margin:8vh auto 0}.auth h1{font-size:44px;margin-bottom:8px}.auth form{display:grid;gap:10px;margin-top:18px}.auth input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:11px 12px;width:100%}
.tabsep{flex:0 0 1px;width:1px;background:var(--line);margin:10px 6px}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tile a.img{display:block;aspect-ratio:4/3;background:var(--chip)}
.tile a.img img{width:100%;height:100%;object-fit:cover;display:block}
.tile a.img span{display:flex;height:100%;align-items:center;justify-content:center;font-size:32px}
.tile button{background:none;border:0;text-align:left;padding:8px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.progress{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good)}
.md{font-size:16px;line-height:1.6}
.md h2,.md h3,.md h4{font-family:"Libre Caslon Display","Libre Caslon Text",Georgia,"Times New Roman",serif;margin:18px 0 6px}
.md h2{font-size:26px}.md h3{font-size:22px}.md h4{font-size:19px}
.md p{margin:0 0 10px}.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.92em}
.md pre{background:var(--chip);padding:10px;border-radius:6px;overflow-x:auto}
.md table{min-width:0}
.list1{display:grid;gap:10px;max-width:860px}
.cmp table{table-layout:fixed}
.cmp th,.cmp td{vertical-align:top;font-size:15px;border-right:1px solid var(--line)}
.cmp tbody tr{cursor:default}
.cmp tbody tr:hover{background:none}
.cmp .cmp-label{position:sticky;left:0;z-index:1;width:170px;background:var(--chip);color:var(--muted);text-align:left}
.cmp thead th,.cmp tr:first-child th{background:var(--surface)}
.cmp tr:first-child th.cmp-label{background:var(--chip)}
.cmp td.best{background:color-mix(in srgb,var(--good) 12%,transparent)}
.cmp .declined{opacity:.5}
@media print{
  header.top,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .tablewrap{overflow:visible;border:0}
  .cmp table{min-width:0!important;width:100%}
  .cmp .cmp-label{position:static}
}

/* ---- Edwardian styling: painted-woodwork header, brass details, double rules, panelled cards ---- */
header.top{background:var(--header);border-bottom:3px double var(--accent)}
.brand b{color:var(--header-ink)}
.brand span{color:var(--header-muted);font-style:italic}
#signOut{color:var(--header-ink);white-space:nowrap}
nav.tabs{flex-wrap:wrap;overflow:visible;row-gap:0}
#navSelect{display:none}
@media (max-width:760px){
  nav.tabs{display:none!important}
  #navSelect{display:block;width:100%;margin:8px 0 10px;padding:9px 12px;border-radius:3px;border:1px solid var(--accent);background:var(--green);color:var(--header-ink);font:16px "Libre Caslon Text",Georgia,serif;font-variant:small-caps;letter-spacing:.05em}
  #navSelect[hidden]{display:none}
}
@media (max-width:560px){.brand span{display:none}}
nav.tabs button{color:var(--header-muted);font-variant:small-caps;letter-spacing:.06em;font-size:16px;padding:9px 9px 10px}
nav.tabs button[aria-current="page"]{color:var(--header-ink);border-bottom-color:var(--accent)}
nav.tabs .count{color:var(--accent)}
.tabsep{background:rgba(239,231,212,.18)}
.viewhead{border-bottom:3px double var(--line);padding-bottom:14px;margin-bottom:18px}
.viewhead h2{font-size:38px;font-weight:400;letter-spacing:.005em}
.viewhead p{font-style:italic}
.btn{border-radius:3px;border-color:var(--line)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:400;letter-spacing:.02em}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{color:var(--blue)}
.panel{border-radius:3px;box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5px var(--line)}
.card{border-radius:3px}
.card h3{font-weight:400}
.card:hover{border-color:var(--accent)}
.badge{border-radius:2px;font-variant:small-caps;letter-spacing:.04em;font-size:14px;padding:0 7px}
.chips button{border-radius:2px;font-variant:small-caps;letter-spacing:.04em}
.chips button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.f label,th,.legend span{font-variant:small-caps;letter-spacing:.05em}
th{background:var(--chip)}
.banner{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:2px}
.group > h3{font-size:24px}
.ov h3{font-size:23px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.hero h1{font-weight:400;letter-spacing:-.005em;line-height:1.05}
.hero .addr{font-style:italic}
.ornament{display:flex;align-items:center;gap:14px;color:var(--accent);margin:14px 0 4px;max-width:520px}
.ornament::before,.ornament::after{content:"";flex:1;height:0;border-top:3px double currentColor;opacity:.7}
.ornament svg{flex:0 0 auto}
.budgetbar{border-radius:2px}
.empty{border:3px double var(--line);border-radius:3px;background:var(--surface)}
.empty h3{font-size:28px}
.m-head h2{font-size:28px}
dialog{border-radius:4px;border:1px solid var(--line)}
.g-today{background:var(--accent)}
.g-today span{background:var(--accent);color:var(--surface)}
body .months b{background:var(--green)}
.progress i{background:var(--green)}
.auth h1{font-size:46px}
body .toast{background:var(--green);color:var(--on-green);border-radius:3px}
:focus-visible{outline-color:var(--accent)}
tr.needs td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.catbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.catbar .track{height:14px;background:var(--chip);border-radius:3px;overflow:hidden;display:flex}
.catbar .track i{display:block;height:100%}
.months{display:flex;align-items:flex-end;gap:6px;height:150px;overflow-x:auto;padding-top:18px}
.months div{flex:1 0 38px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);gap:4px}
.months b{display:block;width:100%;max-width:44px;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}
.months span.v{font-variant-numeric:tabular-nums;color:var(--ink);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:50;font-size:15px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="brand"><b id="brandName">98 Woodlawn Renovation</b><span id="brandSub"></span></div><button class="btn ghost" id="signOut" hidden>Sign out</button></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <select id="navSelect" aria-label="Go to section"></select>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === "" || v == null || isNaN(+v)) ? 0 : +v;
const money = v => (v === "" || v == null || isNaN(+v)) ? "—" : (+v < 0 ? "−$" : "$") + Math.abs(+v).toLocaleString(undefined,{maximumFractionDigits:0});
const D = s => new Date(s + "T00:00:00");
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const fmtDate = s => s ? D(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtShort = s => s ? D(s).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

// ---------- schema ----------
const TRADES = ["Design & architecture","Engineering","Permits & fees","Demolition","Excavation & foundation","Framing","Roofing","Windows & doors","Siding & exterior","Plumbing","Electrical","HVAC","Insulation","Drywall","Flooring","Tile","Cabinetry","Countertops","Paint","Trim & finish carpentry","Fixtures & appliances","Landscaping","Cleanup & disposal","Contingency"];

// ---------- persistence ----------
const run = async p => { const {error} = await p; if(error) throw error; };
async function loadAll(){
  const {data: rows, error} = await sb.from("records").select("id,collection,data").order("created_at");
  if(error){ toast("Couldn't load your records. Reload the page to try again."); return; }
  COLS.forEach(c => data[c] = []); project = {}; projectId = null;
  rows.forEach(r => {
    if(r.collection === "project"){ project = {...r.data}; projectId = r.id; }
    else if(data[r.collection]) data[r.collection].push({...r.data, id: r.id});
  });
  live = true; render();
}
async function save(col, id, body){
  const stamp = {updated_at: new Date().toISOString()};
  if(col === "project"){
    if(projectId) await run(sb.from("records").update({data: body, ...stamp}).eq("id", projectId));
    else await run(sb.from("records").insert({collection: "project", data: body}));
  } else if(id) await run(sb.from("records").update({data: body, ...stamp}).eq("id", id));
  else await run(sb.from("records").insert({collection: col, data: body}));
  await loadAll();
}
async function insertOne(col, body){
  const {data: row, error} = await sb.from("records").insert({collection: col, data: body}).select("id").single();
  if(error) throw error;
  return row.id;
}
async function insertMany(col, bodies){
  await run(sb.from("records").insert(bodies.map(b => ({collection: col, data: b}))));
  await loadAll();
}
async function removeFiles(files){
  const paths = (files || []).map(f => f.path).filter(Boolean);
  if(paths.length) await sb.storage.from(BUCKET).remove(paths);
}
async function remove(col, id){
  const rec = data[col].find(x => x.id === id);
  await run(sb.from("records").delete().eq("id", id));
  await removeFiles(rec && rec.files).catch(() => {});
  await loadAll();
}

// Signed links for private files, fetched in batches and cached for the visit
const urlCache = {}; const pendingUrls = new Set(); let urlTimer = null;
function fileUrl(path){
  if(!path) return "";
  if(urlCache[path]) return urlCache[path];
  pendingUrls.add(path);
  if(!urlTimer) urlTimer = setTimeout(fetchUrls, 0);
  return "";
}
async function fetchUrls(){
  urlTimer = null;
  const paths = [...pendingUrls]; pendingUrls.clear();
  if(!paths.length) return;
  const {data: res, error} = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 6);
  if(error) paths.forEach(p => urlCache[p] = "#");
  else res.forEach((r, i) => urlCache[r.path || paths[i]] = r.signedUrl || "#");
  render();
}

async function startSession(){
  if(started) return; started = true;
  const {data: ok, error} = await sb.rpc("is_member");
  member = !error && ok === true; canWrite = member;
  if(!member){ connecting = false; render(); return; }
  connecting = false;
  await loadAll();
  render();
  let t = null;
  sb.channel("records-changes")
    .on("postgres_changes", {event: "*", schema: "public", table: "records"}, () => { clearTimeout(t); t = setTimeout(loadAll, 400); })
    .subscribe();
}

async function init(){
  if(!configured){ connecting = false; render(); return; }
  const hp = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  const linkErr = hp.get("error_code") || hp.get("error");
  if(linkErr){
    authMsg = /expired|otp/i.test(linkErr + hp.get("error_description"))
      ? "That sign-in link has expired or was already used. This often happens when an email program checks links before you click them. Request a new one and enter the code from the email instead."
      : "Sign-in didn't complete: " + (hp.get("error_description") || linkErr).replace(/\+/g, " ");
    history.replaceState(null, "", location.pathname);
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const {data: {session: s}} = await sb.auth.getSession();
  session = s;
  sb.auth.onAuthStateChange((ev, s2) => {
    session = s2;
    if(ev === "SIGNED_OUT"){ location.reload(); return; }
    if(s2) setTimeout(startSession, 0);
  });
  if(session) await startSession(); else { connecting = false; render(); }
}

  if(!session) return `<div class="auth"><h1>${PORTAL_NAME}</h1>${ORNAMENT}<p class="meta">Only people on this portal's member list can see the project.</p>

      <input type="email" id="authEmail" required placeholder="Email" autocomplete="username" aria-label="Email">
      <input type="password" id="authPass" required placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <p class="meta" id="authMsg">${esc(authMsg)}</p></div>`;
  if(member === false) return `<div class="auth"><h1>No access yet</h1><p>${esc(session.user.email)} isn't on this portal's member list. Ask the owner to add your email, then reload this page.</p></div>`;
  return "";
}

    <div class="row">${extra}${canWrite ? `<button class="btn primary" data-add="${col}">Add ${s.one}</button>` : ""}</div></div>`;
}
function empty(col, title, text, extra = ""){
  return `<div class="empty"><h3>${title}</h3><p>${text}</p><div class="row">${canWrite ? `<button class="btn primary" data-add="${col}">Add ${S[col].one}</button>` : ""}${extra}</div></div>`;

function filesHTML(files){
  if(!files || !files.length) return "";
  return `<div class="files">${files.map(f => `<a class="file" href="${esc(fileUrl(f.path) || "#")}" target="_blank" rel="noopener" data-stop>${fileIcon(f.type)}<span>${esc(f.name)}</span></a>`).join("")}</div>`;
}
function firstImage(files){
  const f = (files || []).find(f => (f.type || "").startsWith("image/"));

  return u && u !== "#" ? `<img class="thumb" src="${esc(u)}" alt="${esc(f.name)}" loading="lazy">` : "";

function fileIcon(t){ t = t || ""; return t.includes("pdf") ? "📄" : (t.includes("sheet") || t.includes("excel") || t.includes("csv")) ? "📊" : (t.includes("word") || t.includes("document")) ? "📝" : t.startsWith("image/") ? "🖼️" : t.startsWith("video/") ? "🎞️" : "📎"; }
function badge(text, kind){ return text ? `<span class="badge ${kind || ""}">${esc(text)}</span>` : ""; }
const statusKind = s => ({Passed:"good",Issued:"good",Decided:"good",Closed:"good","Fixed – to check":"warn","In progress":"warn",Applied:"warn",Booked:"warn",Shortlisted:"warn","Failed – re-inspection needed":"bad",Open:"bad",Accepted:"good",Approved:"good",Installed:"good",Delivered:"good","Issued for construction":"good",Declined:"bad",Rejected:"bad",Superseded:"bad",Pending:"warn","Under review":"warn","For review":"warn",Ordered:"warn"}[s] || "");

// ---- Overview ----
function money3(){
  const lineBudget = sum(data.budget, b => b.budgeted);
  const budget = num(project.budget) || lineBudget;
  const coApproved = sum(data.changeOrders.filter(c => c.status === "Approved"), c => c.costImpact);
  const committed = sum(data.budget, b => b.committed) + coApproved;
  const paid = data.invoices.length ? sum(data.invoices, invPaid) : sum(data.budget, b => b.paid);
  return {budget, lineBudget, coApproved, committed, paid};
}

    const total = Math.max(1, Math.ceil(daysBetween(pStart, pEnd) / 7));

  }
  const hero = project.address || schedLine

  const now = tasks.filter(x => x.start <= t && x.end >= t);
  const next = tasks.filter(x => x.start > t).sort((a, b) => a.start.localeCompare(b.start)).slice(0, 4);
  const li = (col, x, left, right) => `<li><button data-edit="${col}" data-id="${esc(x.id)}">${left}</button><span class="meta">${right}</span></li>`;
  const pendQ = data.quotes.filter(q => q.status === "Received" || q.status === "Under review" || !q.status);
  const pendCO = data.changeOrders.filter(c => c.status === "Pending");
  const follow = data.conversations.filter(c => c.followUp).sort((a, b) => (a.followUpDate || "9").localeCompare(b.followUpDate || "9")).slice(0, 5);
  const mats = data.materials.filter(m => m.status === "Specified" || m.status === "Quoted" || !m.status).sort((a, b) => (a.needBy || "9").localeCompare(b.needBy || "9")).slice(0, 5);
  const recent = data.conversations.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 4);

  const list = (title, items, emptyText) => `<div class="panel"><h3>${title}</h3>${items.length ? `<ul>${items.join("")}</ul>` : `<p class="meta">${emptyText}</p>`}</div>`;

  return `<section class="hero">${hero}
    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="font-size:22px">Budget</h3>${canWrite ? `<button class="btn ghost" data-project>Edit project details</button>` : ""}</div>
      <div class="budgetbar" role="img" aria-label="Paid ${money(paid)}, committed ${money(committed)} of ${money(budget)} budget">
        <i style="width:${pPaid}%;background:var(--green)"></i><i style="width:${pCom}%;background:var(--accent)"></i>
      </div>
      <div class="legend">
        <div><span><span class="sw" style="background:var(--line);border:1px solid var(--muted)"></span>Budget</span><b>${money(budget)}</b></div>
        <div><span><span class="sw" style="background:var(--accent)"></span>Committed</span><b>${money(committed)}</b></div>
        <div><span><span class="sw" style="background:var(--green)"></span>Paid</span><b>${money(paid)}</b></div>
        <div><span>${remaining < 0 ? "Over budget" : "Uncommitted"}</span><b class="${remaining < 0 ? "neg" : ""}">${money(Math.abs(remaining))}</b></div>
      </div>
      ${coApproved ? `<p class="meta" style="margin:8px 0 0">Committed includes ${money(coApproved)} in approved change orders.</p>` : ""}
    </div></section>
    <div class="ov">
      ${list("Happening now", now.map(x => li("tasks", x, esc(x.name), `${x.progress ? num(x.progress) + "% · " : ""}until ${fmtShort(x.end)}`)), "Nothing scheduled for today.")}
      ${list("Coming up", next.map(x => li("tasks", x, esc(x.name), "starts " + fmtShort(x.start))), "Add tasks in Timeline to see what's next.")}
      ${list("Decisions waiting", [
          ...pendQ.slice(0, 4).map(q => li("quotes", q, `Quote: ${esc(q.vendor)}${q.trade ? " (" + esc(q.trade) + ")" : ""}`, money(q.amount))),
          ...pendCO.map(c => li("changeOrders", c, `Change order: ${esc(c.title)}`, money(c.costImpact))),
          ...data.selections.filter(x => x.status !== "Decided" && x.status !== "Ordered" && x.decideBy && x.decideBy <= addDays(t, 21)).sort((a, b) => a.decideBy.localeCompare(b.decideBy)).slice(0, 4).map(x => li("selections", x, `Choose: ${esc(x.item)}`, x.decideBy < t ? `<span class="neg">overdue</span>` : "by " + fmtShort(x.decideBy)))
        ], "No open quotes, change orders or selections due.")}
      ${list("Inspections", [
          ...data.permits.filter(x => /Failed/.test(x.status || "")).map(x => li("permits", x, esc(x.name), `<span class="neg">re-inspection needed</span>`)),
          ...data.permits.filter(x => x.status === "Booked" && x.date).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3).map(x => li("permits", x, esc(x.name), "booked " + fmtShort(x.date)))
        ], "No inspections booked.")}
      ${list("Punch list", data.punch.filter(x => x.status !== "Closed").sort((a, b) => ({High: 0, Normal: 1, Low: 2}[a.priority] ?? 1) - ({High: 0, Normal: 1, Low: 2}[b.priority] ?? 1)).slice(0, 5).map(x => li("punch", x, esc(x.item), esc(x.status || "Open"))), "Nothing open on the punch list.")}
      ${list("Documents to update", data.documents.filter(d => d.expiry && d.expiry <= addDays(t, 30)).sort((a, b) => a.expiry.localeCompare(b.expiry)).slice(0, 5).map(d => li("documents", d, `${esc(d.company)}: ${esc(d.docType || "Document")}`, d.expiry < t ? `<span class="neg">expired</span>` : "expires " + fmtShort(d.expiry))), "No documents expiring in the next 30 days.")}
      ${list("Invoices to pay", data.invoices.filter(x => invOwing(x) > 0).sort((a, b) => (a.dueDate || "9").localeCompare(b.dueDate || "9")).slice(0, 5).map(x => li("invoices", x, `${esc(x.vendor || "Invoice")} <span class="meta">${money(invOwing(x))}</span>`, x.dueDate ? (x.dueDate < t ? `<span class="neg">overdue</span>` : "due " + fmtShort(x.dueDate)) : "")), "No unpaid invoices.")}
      ${list("Follow-ups", follow.map(c => li("conversations", c, `${esc(c.followUp)} <span class="meta">(${esc(c.person)})</span>`, c.followUpDate ? (c.followUpDate < t ? `<span class="neg">overdue</span>` : "by " + fmtShort(c.followUpDate)) : "")), "No follow-ups logged.")}
      ${list("Materials to order", mats.map(m => li("materials", m, esc(m.item), m.needBy ? "need by " + fmtShort(m.needBy) : esc(m.leadTime || ""))), "Everything selected has been ordered.")}
      ${list("Latest conversations", recent.map(c => li("conversations", c, `${esc(c.person)}: ${esc(c.subject || c.method || "")}`, fmtShort(c.date))), "Log calls, meetings and site visits in Conversations.")}
    </div>`;
}

// ---- Timeline ----
function vTimeline(){
  const tasks = data.tasks.filter(x => x.start && x.end).sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
  const starter = canWrite ? `<button class="btn" data-starter="tasks">Load a typical renovation schedule</button>` : "";
  if(!tasks.length) return head("tasks") + empty("tasks", "No schedule yet", "Add tasks one at a time, or start from a typical renovation-with-addition sequence and adjust the dates.", starter);
  let min = tasks[0].start, max = tasks.reduce((m, x) => x.end > m ? x.end : m, tasks[0].end);
  const md = D(min); md.setDate(md.getDate() - ((md.getDay() + 6) % 7)); min = iso(md); // back to Monday
  max = addDays(max, 10);
  const dayW = 7, days = daysBetween(min, max) + 1, W = days * dayW;
  let headHTML = "";
  for(let i = 0; i < days; i++){
    const d = D(addDays(min, i));
    if(d.getDate() === 1 || i === 0) headHTML += `<div class="g-month" style="left:${i*dayW}px">${d.toLocaleDateString(undefined,{month:"short",year: d.getMonth() === 0 || i === 0 ? "numeric" : undefined})}</div>`;
    if(i % 7 === 0) headHTML += `<div class="g-week" style="left:${i*dayW}px">${d.getDate()}</div>`;
  }
  const grid = `background-image:repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px ${7*dayW}px)`;
  const t = todayISO();
  const today = (t >= min && t <= max) ? `<div class="g-today" style="left:${daysBetween(min, t)*dayW}px"><span>Today</span></div>` : "";
  const labels = tasks.map(x => `<button class="g-label" data-edit="tasks" data-id="${esc(x.id)}"><b>${esc(x.name)}</b><small>${fmtShort(x.start)} – ${fmtShort(x.end)}</small></button>`).join("");
  const rows = tasks.map(x => {
    const l = daysBetween(min, x.start) * dayW, w = (daysBetween(x.start, x.end) + 1) * dayW;
    return `<div class="g-row" style="${grid}"><button class="g-bar" style="left:${l}px;width:${w}px;background:${phaseColor(x.phase)}" data-edit="tasks" data-id="${esc(x.id)}" aria-label="${esc(x.name)}, ${num(x.progress)}% complete"><i style="width:${Math.min(100, num(x.progress))}%"></i></button></div>`;
  }).join("");
  const used = PHASES.filter(p => tasks.some(x => x.phase === p));
  const late = tasks.filter(x => x.end < t && num(x.progress) < 100).length;
  return head("tasks") + `
    ${late ? `<p class="banner">${late} task${late > 1 ? "s are" : " is"} past the finish date and not marked 100% complete.</p>` : ""}
    <div class="gantt">
      <div class="g-labels"><div class="g-h"></div>${labels}</div>
      <div class="g-scroll" id="gscroll"><div class="g-canvas" style="width:${W}px"><div class="g-h" style="position:relative">${headHTML}</div>${rows}${today}</div></div>
    </div>
    <div class="g-legend">${used.map(p => `<span><i style="background:${phaseColor(p)}"></i>${p}</span>`).join("")}<span>Darker fill shows progress</span></div>`;
}

// ---- Quotes ----
function vQuotes(){
  if(compareTrade && data.quotes.some(q => (q.trade || "Other") === compareTrade)) return vCompare(compareTrade);
  if(!data.quotes.length) return head("quotes") + empty("quotes", "No quotes yet", "Add each bid as it comes in and attach the PDF or photo of the quote.");
  const groups = {};
  data.quotes.forEach(q => (groups[q.trade || "Other"] ||= []).push(q));
  const accepted = sum(data.quotes.filter(q => q.status === "Accepted"), q => q.amount);
  return head("quotes") + `<p class="meta" style="margin-top:-6px">${data.quotes.length} quotes across ${Object.keys(groups).length} trades. Accepted total ${money(accepted)}.</p>` +
    Object.keys(groups).sort().map(g => {
      const qs = groups[g].sort((a, b) => num(a.amount) - num(b.amount));
      const priced = qs.filter(q => num(q.amount) > 0 && q.status !== "Declined");
      const low = priced[0], high = priced[priced.length - 1];
      return `<div class="group"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${esc(g)} <span class="meta" style="font-family:'Libre Caslon Text',Georgia,serif;font-size:15px">${qs.length} quote${qs.length > 1 ? "s" : ""}${priced.length > 1 ? ` · spread ${money(num(high.amount) - num(low.amount))}` : ""}</span></h3>${qs.length > 1 ? `<button class="btn primary" data-compare="${esc(g)}">Compare ${qs.length} quotes</button>` : ""}</div><div class="grid">${qs.map(q => `
        <div class="card" data-edit="quotes" data-id="${esc(q.id)}" tabindex="0" role="button">
          <div class="row" style="justify-content:space-between"><h3>${esc(q.vendor)}</h3>${badge(q.status || "Received", statusKind(q.status))}</div>
          <div class="amount">${money(q.amount)}</div>
          <div class="meta">${q.date ? "Received " + fmtDate(q.date) : ""}${q.validUntil ? ` · valid until ${fmtDate(q.validUntil)}` : ""}${priced.length > 1 && q === low ? ` · <b class="pos">lowest</b>` : ""}</div>
          ${q.startDate || q.duration ? `<div class="meta">${esc([q.startDate && "Can start " + fmtDate(q.startDate), q.duration].filter(Boolean).join(" · "))}</div>` : ""}
          ${q.rating ? `<div class="meta">Your rating: ${esc(q.rating)}</div>` : ""}
          ${q.notes ? `<p class="notes">${esc(q.notes)}</p>` : ""}${filesHTML(q.files)}
        </div>`).join("")}</div></div>`;
    }).join("");
}

// ---- Quote comparison ----
function docCell(vendor, type){
  const t = todayISO();
  const docs = data.documents.filter(d => lc(d.company) === lc(vendor) && d.docType === type).sort((a, b) => (b.expiry || "9").localeCompare(a.expiry || "9"));
  const add = canWrite ? ` <button class="btn ghost noprint" style="padding:0 2px" data-adddoc="${esc(vendor)}" data-doctype="${esc(type)}">Add</button>` : "";
  if(!docs.length) return `<span class="neg">Not on file</span>${add}`;
  const d = docs[0];
  if(d.expiry && d.expiry < t) return `<span class="neg">Expired ${fmtDate(d.expiry)}</span>${add}`;
  return `<span class="pos">✓ On file</span>${d.expiry ? `<div class="meta">until ${fmtDate(d.expiry)}</div>` : ""}`;
}
const QUOTE_GAPS = [["amount","price"],["validUntil","valid-until date"],["startDate","start date"],["duration","duration"],["includes","what's included"],["excludes","what's excluded"],["paymentSchedule","payment schedule"],["warranty","warranty"]];
function vCompare(trade){
  const t = todayISO();
  const qs = data.quotes.filter(q => (q.trade || "Other") === trade).sort((a, b) => ((a.status === "Declined") - (b.status === "Declined")) || (num(a.amount) || 9e15) - (num(b.amount) || 9e15));
  const live = qs.filter(q => q.status !== "Declined" && num(q.amount) > 0);
  const low = live.length ? Math.min(...live.map(q => num(q.amount))) : 0;
  const ns = `<span class="meta"><i>Not stated</i></span>`;
  const txt = v => v ? `<div style="white-space:pre-wrap">${esc(v)}</div>` : ns;
  const isLow = q => live.length > 1 && q.status !== "Declined" && num(q.amount) === low;
  const rows = [
    ["Quoted price", q => num(q.amount) ? `<span class="amount" style="font-size:24px">${money(q.amount)}</span>${isLow(q) ? `<div class="pos">Lowest</div>` : (low && q.status !== "Declined" && num(q.amount) > low ? `<div class="meta">${money(num(q.amount) - low)} more (${Math.round((num(q.amount) - low) / low * 100)}%)</div>` : "")}` : ns, isLow],
    ["Status", q => badge(q.status || "Received", statusKind(q.status))],
    ["Deposit", q => (q.deposit !== "" && q.deposit != null) ? money(q.deposit) + (num(q.amount) ? ` <span class="meta">(${Math.round(num(q.deposit) / num(q.amount) * 100)}% of price)</span>` : "") : ns],
    ["Valid until", q => q.validUntil ? (q.validUntil < t ? `<span class="neg">Expired ${fmtDate(q.validUntil)}</span>` : fmtDate(q.validUntil)) : ns],
    ["Earliest start", q => q.startDate ? fmtDate(q.startDate) : ns],
    ["Duration", q => txt(q.duration)],
    ["Included", q => txt(q.includes)],
    ["Excluded", q => txt(q.excludes)],
    ["Allowances", q => txt(q.allowances)],
    ["Payment schedule", q => txt(q.paymentSchedule)],
    ["Warranty", q => txt(q.warranty)],
    ["Liability insurance", q => docCell(q.vendor, "Liability insurance certificate")],
    ["WSIB clearance", q => docCell(q.vendor, "WSIB clearance certificate")],
    ["Your rating", q => q.rating ? esc(q.rating) : ns],
    ["Other notes", q => q.notes ? txt(q.notes) : `<span class="meta">—</span>`],
    ["Quote documents", q => filesHTML(q.files) || `<span class="meta">None attached</span>`]
  ];
  const gaps = qs.filter(q => q.status !== "Declined").map(q => [q, QUOTE_GAPS.filter(([k]) => !q[k] && q[k] !== 0).map(g => g[1])]).filter(([, g]) => g.length);
  const colW = 240;
  const head = `<tr><th class="cmp-label"></th>${qs.map(q => `<th class="${q.status === "Declined" ? "declined" : ""}"><div style="font-variant:normal;letter-spacing:0;font-size:19px;color:var(--ink);font-family:'Libre Caslon Display',Georgia,serif">${esc(q.vendor)}</div>${q.contact ? `<div class="meta" style="font-variant:normal;letter-spacing:0">${esc(q.contact)}</div>` : ""}${q.status === "Accepted" ? `<div style="margin-top:4px">${badge("Accepted", "good")}</div>` : ""}</th>`).join("")}</tr>`;
  const body = rows.map(([label, fn, hi]) => `<tr><th class="cmp-label">${label}</th>${qs.map(q => `<td class="${q.status === "Declined" ? "declined" : ""} ${hi && hi(q) ? "best" : ""}">${fn(q)}</td>`).join("")}</tr>`).join("");
  const actions = canWrite ? `<tr class="noprint"><th class="cmp-label"></th>${qs.map(q => `<td class="${q.status === "Declined" ? "declined" : ""}"><div class="row"><button class="btn" data-edit="quotes" data-id="${esc(q.id)}">Edit</button>${q.status !== "Accepted" ? `<button class="btn primary" data-accept="${esc(q.id)}">Accept</button>` : ""}</div></td>`).join("")}</tr>` : "";
  return `<div class="viewhead"><div><button class="btn ghost noprint" data-compare="" style="padding-left:0">← All quotes</button><h2>${esc(trade)}</h2><p>Comparing ${qs.length} quotes${live.length > 1 ? `. Prices range from ${money(low)} to ${money(Math.max(...live.map(q => num(q.amount))))}` : ""}.</p></div>
    <div class="row noprint"><button class="btn" data-print>Print</button>${canWrite ? `<button class="btn" data-add="quotes" data-trade="${esc(trade)}">Add another quote</button>` : ""}</div></div>

async function updRec(rec, changes){

async function acceptQuote(id){
  const q = data.quotes.find(x => x.id === id); if(!q) return;
  const trade = q.trade || "Other";
  const others = data.quotes.filter(x => x.id !== id && (x.trade || "Other") === trade && x.status !== "Declined");
  if(!confirm(`Accept ${q.vendor}'s quote of ${money(q.amount)}?${others.length ? `\n\nThe other ${others.length} ${trade} quote${others.length > 1 ? "s" : ""} will be marked declined. You can change this later.` : ""}`)) return;
  await updRec(q, {status: "Accepted"});
  for(const o of others) await updRec(o, {status: "Declined"});
  const line = data.budget.find(b => lc(b.category) === lc(trade)) || data.budget.find(b => lc(b.vendor) && lc(b.vendor) === lc(q.vendor));
  if(line && num(q.amount) && confirm(`Also set the committed amount for the "${lineName(line)}" budget line to ${money(q.amount)}?`)) await updRec(line, {committed: num(q.amount), vendor: line.vendor || q.vendor});
  await loadAll();
  toast(`${q.vendor} accepted.`);
}

  const {coApproved} = money3();
  const inv = id => data.invoices.filter(x => { const l = lineFor(x); return l && l.id === id; });
  const calc = r => { const xs = inv(r.id); return {n: xs.length, invoiced: sum(xs, x => x.total), paid: xs.length ? sum(xs, invPaid) : num(r.paid)}; };
  const body = rows.map(r => {
    const c = calc(r), spent = Math.max(num(r.committed), c.invoiced), variance = num(r.budgeted) - spent;
    return `<tr data-edit="budget" data-id="${esc(r.id)}"><td>${esc(r.category)}</td><td>${esc(r.item || "")}<div class="meta">${esc(r.vendor || "")}</div></td>

      <td class="n ${spent ? (variance < 0 ? "neg" : "pos") : ""}">${spent ? money(variance) : "—"}</td></tr>`;
  }).join("");
  const unassigned = data.invoices.filter(x => !lineFor(x));
  const unRow = unassigned.length ? `<tr data-view="invoices"><td>Not assigned</td><td class="meta">Invoices without a budget line. Open one in Expenses to assign it.</td><td class="n">—</td><td class="n">—</td><td class="n">${money(sum(unassigned, x => x.total))}<div class="meta">${unassigned.length} invoice${unassigned.length > 1 ? "s" : ""}</div></td><td class="n">${money(sum(unassigned, invPaid))}</td><td class="n">—</td></tr>` : "";

  const tb = sum(rows, r => r.budgeted), tc = sum(rows, r => r.committed) + coApproved;
  const ti = sum(rows, r => calc(r).invoiced) + sum(unassigned, x => x.total), tp = sum(rows, r => calc(r).paid) + sum(unassigned, invPaid);
  const contingency = num(project.contingency) ? `<p class="meta">Contingency set at ${num(project.contingency)}% (${money((num(project.budget) || tb) * num(project.contingency) / 100)}) of the total budget.</p>` : "";
  return head("budget") + `
    ${num(project.budget) && Math.abs(num(project.budget) - tb) > 1 ? `<p class="banner">Line items add up to ${money(tb)}; your total project budget is ${money(project.budget)}.</p>` : ""}
    <div class="tablewrap"><table>
      <thead><tr><th>Category</th><th>Description</th><th class="n">Budgeted</th><th class="n">Committed</th><th class="n">Invoiced</th><th class="n">Paid</th><th class="n">Variance</th></tr></thead>
      <tbody>${body}${unRow}${coRow}</tbody>
      <tfoot><tr><td colspan="2">Total</td><td class="n">${money(tb)}</td><td class="n">${money(tc)}</td><td class="n">${money(ti)}</td><td class="n">${money(tp)}</td><td class="n ${tb - Math.max(tc, ti) < 0 ? "neg" : "pos"}">${money(tb - Math.max(tc, ti))}</td></tr></tfoot>
    </table></div>${contingency}<p class="meta">Invoiced and Paid come from the invoices assigned to each line in Expenses. Lines with no invoices use the Paid amount you enter. Variance is budgeted minus whichever is higher, committed or invoiced. Tap a row to edit.</p>`;

const INV_CATS = S.invoices.fields.find(f => f.k === "category").o;
const LABEL_TO_CAT = {"General contractor":"General contractor","Designer":"Designer","Architect":"Architect","Engineer":"Engineer","Surveyor":"Surveyor","Subcontractor":"Subcontractor","Supplier":"Materials & supplies","Inspector":"Permits & inspections","Lender":"Financing","Other":"Other"};
const CAT_COLORS = ["#7E9474","#963A2D","#B98A3E","#8A6A4F","#5B6E86","#B07A78","#4F7D78","#A8844F","#6F7344","#7A5873"];
const catColor = c => CAT_COLORS[Math.max(0, INV_CATS.indexOf(c)) % CAT_COLORS.length];
const kfmt = n => n >= 1000 ? "$" + (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k" : "$" + Math.round(n);
function invHeld(x){ return x.status === "Paid" ? 0 : Math.min(num(x.holdback), num(x.total)); }
function invPaid(x){ return x.status === "Paid" ? num(x.total) : x.status === "Holdback held" ? Math.max(0, num(x.total) - num(x.holdback)) : x.status === "Partially paid" ? Math.min(num(x.paidAmount), num(x.total)) : 0; }
function invOwing(x){ return Math.max(0, num(x.total) - invHeld(x) - invPaid(x)); }
function lineFor(x){ return data.budget.find(b => b.id === x.budgetLineId) || (!x.budgetLineId && x.budgetLine ? data.budget.find(b => lc(b.category) === lc(x.budgetLine)) : null); }
function lineName(b){ return b ? b.category + (b.item ? " — " + b.item : "") : ""; }
const CAT_LINE_WORDS = {"Surveyor":["survey"],"Architect":["architect","design"],"Designer":["design","interior"],"Engineer":["engineer"],"Permits & inspections":["permit"],"General contractor":["general","contract","construction"],"Materials & supplies":["material"],"Financing":["financ","interest"]};
function guessBudgetLine(inv){
  const v = lc(inv.vendor);
  let b = v && data.budget.find(b => lc(b.vendor) && (lc(b.vendor) === v || v.includes(lc(b.vendor)) || lc(b.vendor).includes(v)));
  if(!b){ const words = CAT_LINE_WORDS[inv.category] || []; b = data.budget.find(b => words.some(w => lc(b.category).includes(w))); }
  return b ? b.id : "";
}
const HOLDBACK_CATS = ["General contractor","Subcontractor"];
function defaultHoldback(inv){
  if(!HOLDBACK_CATS.includes(inv.category)) return "";
  const base = num(inv.subtotal) || (num(inv.total) - num(inv.tax));
  return base > 0 ? Math.round(base * 10) / 100 : "";
}

async function uploadToStorage(file){
  const path = `${crypto.randomUUID()}/${file.name.replace(/[^\w.\-]+/g, "_")}`;
  const {error} = await sb.storage.from(BUCKET).upload(path, file, {contentType: file.type || "application/octet-stream"});
  if(error) throw error;
  const {data: su} = await sb.storage.from(BUCKET).createSignedUrl(path, 60 * 60 * 6);
  if(su && su.signedUrl) urlCache[path] = su.signedUrl;
  return {path, name: file.name, type: file.type || "", size: file.size};
}

// Reading PDF invoices in the browser
let pdfjsReady = null;
function loadPdfJs(){
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
    sc.onerror = () => { pdfjsReady = null; rej(new Error("pdf reader failed to load")); };
    document.head.appendChild(sc);
  });
  return pdfjsReady;
}
async function pdfLines(file){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: await file.arrayBuffer()}).promise;
  const lines = [];
  for(let p = 1; p <= Math.min(doc.numPages, 3); p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach(it => { if(!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 3) * 3; if(!rows.has(y)) rows.set(y, []); rows.get(y).push({x: it.transform[4], s: it.str}); });
    [...rows.keys()].sort((a, b) => b - a).forEach(y => lines.push(rows.get(y).sort((a, b) => a.x - b.x).map(r => r.s).join("  ").replace(/\s{3,}/g, "   ").trim()));
  }
  return lines.filter(Boolean);
}
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function mkDate(y, m, d){ y = +y; m = +m; d = +d; if(!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y > 1990)) return ""; return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0"); }
function findDate(str){
  let m = str.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/); if(m) return mkDate(m[1], m[2], m[3]);
  m = str.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(20\d{2})\b/i); if(m) return mkDate(m[3], MONTHS[m[1].toLowerCase()], m[2]);
  m = str.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?,?\s+(20\d{2})\b/i); if(m) return mkDate(m[3], MONTHS[m[2].toLowerCase()], m[1]);
  m = str.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d{2})\b/); if(m){ const a = +m[1], b = +m[2]; return a > 12 ? mkDate(m[3], b, a) : mkDate(m[3], a, b); }
  return "";
}
function amounts(str){
  const out = []; const re = /(-?)\$?\s?(\d{1,3}(?:,\d{3})+(?:\.\d{2})?|\d+\.\d{2})(?!\s?%)/g; let m;
  while((m = re.exec(str))) out.push(parseFloat(m[2].replace(/,/g, "")) * (m[1] ? -1 : 1));
  return out;
}
function afterLabel(lines, re, getter, skip){
  for(let i = 0; i < lines.length; i++){
    if(!re.test(lines[i]) || (skip && skip.test(lines[i]))) continue;
    const v = getter(lines[i].slice(lines[i].search(re))) || (lines[i + 1] ? getter(lines[i + 1]) : null);
    if(v) return v;
  }
  return null;
}
function parseInvoice(lines, fileName){
  const out = {};
  const text = lines.join("\n"), lt = text.toLowerCase();
  const lastAmt = s => { const a = amounts(s).filter(n => n > 0); return a.length ? a[a.length - 1] : null; };
  out.total = afterLabel(lines, /amount\s+due|balance\s+due|total\s+due|grand\s+total|invoice\s+total|total\s+amount|amount\s+payable/i, lastAmt)
    || afterLabel(lines, /\btotal\b/i, lastAmt, /sub[\s-]?total|total\s+tax|tax\s+total/i);
  if(!out.total){ const all = amounts(text).filter(n => n > 0); if(all.length) out.total = Math.max(...all); }
  out.subtotal = afterLabel(lines, /sub[\s-]?total/i, lastAmt) || "";
  out.tax = afterLabel(lines, /\b(h\.?s\.?t|g\.?s\.?t|p\.?s\.?t|q\.?s\.?t|sales\s+tax|tax)\b/i, lastAmt, /\btotal\b(?!\s+tax)|tax\s+(id|number|no|registration|#)|registration|business\s+(no|number)|\bbn\b/i) || "";
  if(out.tax && out.total && out.tax >= out.total) out.tax = "";
  if(!out.tax && out.subtotal && out.total && out.total > out.subtotal) out.tax = Math.round((out.total - out.subtotal) * 100) / 100;
  const inv = text.match(/invoice\s*(?:no\.?|number|num\.?|#)\s*[:#.]?\s*([A-Z0-9][A-Z0-9\-\/]{1,20})/i) || text.match(/\binv[\s#:-]+([A-Z0-9\-]{2,20})/i);
  if(inv && !/^(date|to|from)$/i.test(inv[1])) out.invoiceNumber = inv[1];
  out.dueDate = afterLabel(lines, /due\s+date|payment\s+due|date\s+due|\bdue\b/i, findDate) || "";
  out.date = afterLabel(lines, /invoice\s+date|date\s+of\s+issue|date\s+issued|issue\s+date|\bdate\b/i, s => { const d = findDate(s); return d && d !== out.dueDate ? d : ""; }, /due/i) || findDate(text) || "";
  if(/net\s*30/i.test(text) && out.date && !out.dueDate) out.dueDate = addDays(out.date, 30);
  // vendor: match your companies and contacts first
  let co = data.companies.find(c => c.name && lt.includes(lc(c.name)))
    || data.companies.find(c => c.website && lt.includes(lc(c.website).replace(/^https?:\/\//, "").replace(/^www\./, "")));
  let k = null;
  if(!co){ k = data.contacts.find(x => x.email && lt.includes(lc(x.email))) || data.contacts.find(x => x.company && lt.includes(lc(x.company))); if(k) co = companyOf(k); }
  if(co){ out.vendor = co.name; const lab = co.label || (data.contacts.find(x => x.companyId === co.id) || {}).label; if(lab) out.category = LABEL_TO_CAT[lab]; }
  else if(k){ out.vendor = k.company || k.name; if(k.label) out.category = LABEL_TO_CAT[k.label]; }
  else {
    const me = lc(project.name), cand = lines.slice(0, 8).find(l => /[a-z]{3}/i.test(l) && !/invoice|bill\s+to|statement|page\s+\d|^date|^to\b|^from\b|@|\d{3}[\s.\-]\d{4}/i.test(l) && l.split(/\s+/).length <= 7 && lc(l) !== me);
    if(cand) out.vendor = cand.replace(/\s{2,}.*/, "");
  }
  if(!out.category){
    if(/permit|city of|municipal|development charge|building department/i.test(text)) out.category = "Permits & inspections";
    else { const g = guessLabel(text); out.category = g ? LABEL_TO_CAT[g] : ""; }
  }
  if(!out.vendor) out.vendor = fileName.replace(/\.[^.]+$/, "").replace(/[_\-]+/g, " ");
  out.status = /\bpaid\s+in\s+full\b|\bpaid\b.*\bthank you\b|balance\s+due\s*[:$]?\s*\$?\s*0\.00/i.test(text) ? "Paid" : "Unpaid";
  return out;
}

async function handleInvoiceUpload(fileList){
  const files = [...fileList]; if(!files.length) return;
  const created = []; let failed = 0, unread = 0;
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    toast(`Reading invoice ${i + 1} of ${files.length}…`);
    if(f.size > MAX_MB * 1024 * 1024){ failed++; continue; }
    try {
      let parsed = {};
      const isPdf = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name);
      if(isPdf){ try { const lines = await pdfLines(f); if(lines.length > 2) parsed = parseInvoice(lines, f.name); else unread++; } catch(e){ unread++; } }
      else unread++;
      if(!parsed.vendor) parsed.vendor = f.name.replace(/\.[^.]+$/, "").replace(/[_\-]+/g, " ");
      const fileRec = await uploadToStorage(f);
      parsed.holdback = defaultHoldback(parsed);
      parsed.budgetLineId = guessBudgetLine(parsed);
      const body = {vendor: "", category: "", invoiceNumber: "", budgetLineId: "", date: "", dueDate: "", subtotal: "", tax: "", total: "", status: "Unpaid", paidAmount: "", paidDate: "", notes: "", ...parsed, files: [fileRec], needsReview: true, created: Date.now(), updated: Date.now()};
      created.push(await insertOne("invoices", body));
    } catch(e){ failed++; }
  }
  await loadAll();
  const msg = [`${created.length} invoice${created.length === 1 ? "" : "s"} added`, unread && `${unread} couldn't be read automatically`, failed && `${failed} failed to upload`].filter(Boolean).join(", ");
  toast(msg + ".");
  if(created.length === 1){ const rec = data.invoices.find(x => x.id === created[0]); if(rec) openForm("invoices", rec); }
}

      const rec = data.holdbacks.find(h => lc(h.vendor) === lc(v));

function exportInvoices(){
  const cols = [["date","Invoice date"],["vendor","Vendor"],["invoiceNumber","Invoice #"],["category","Category"],["budgetLine","Budget line"],["holdback","Holdback"],["held","Holdback still held"],["subtotal","Subtotal"],["tax","Tax"],["total","Total"],["status","Status"],["paid","Paid"],["owing","Owing"],["dueDate","Due date"],["paidDate","Date paid"],["paymentMethod","Payment method"],["paymentRef","Reference"],["notes","Notes"]];
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const rows = data.invoices.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(x => cols.map(([k]) => q(k === "paid" ? invPaid(x) : k === "owing" ? invOwing(x) : k === "held" ? invHeld(x) : k === "budgetLine" ? lineName(lineFor(x)) : x[k])).join(","));
  const csv = [cols.map(c => c[1]).join(","), ...rows].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type: "text/csv"}));
  a.download = (project.name ? project.name.replace(/[^\w]+/g, "-") + "-" : "") + "invoices-" + todayISO() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function vPermits(){
  const starter = canWrite ? `<button class="btn" data-starter="permits">Add typical Ontario inspections</button>` : "";
  if(!data.permits.length) return head("permits") + empty("permits", "No permits or inspections yet", "Track your building permit and each inspection: when it's booked, whether it passed, and what the inspector said. Start from a typical list for an addition and adjust it to match your permit.", starter);
  const order = ["Building permit", "Other approval", "Inspection"];
  const list = data.permits.slice().sort((a, b) => (order.indexOf(a.type) - order.indexOf(b.type)) || (num(a.seq) - num(b.seq)) || (num(a.created) - num(b.created)));
  const insp = list.filter(x => x.type === "Inspection");
  const done = insp.filter(x => x.status === "Passed" || x.status === "Not required").length;
  const failed = insp.filter(x => /Failed/.test(x.status || ""));
  const next = insp.filter(x => x.status === "Booked" && x.date).sort((a, b) => a.date.localeCompare(b.date))[0];

// ---- Research ----
function mdToHtml(src){
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let html = "", list = null, code = false, para = [], table = [];
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const fP = () => { if(para.length){ html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const fL = () => { if(list){ html += `</${list}>`; list = null; } };
  const fT = () => { if(table.length){ const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim())); html += `<div class="tablewrap" style="margin-bottom:10px"><table>${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table></div>`; table = []; } };
  for(const l of lines){
    if(/^\s*```/.test(l)){ fP(); fL(); fT(); html += code ? "</code></pre>" : "<pre><code>"; code = !code; continue; }
    if(code){ html += esc(l) + "\n"; continue; }
    if(/^\s*\|.*\|\s*$/.test(l)){ fP(); fL(); table.push(l); continue; } else fT();
    let m;
    if((m = l.match(/^(#{1,4})\s+(.*)/))){ fP(); fL(); const n = Math.min(4, m[1].length + 1); html += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)/))){ fP(); if(list !== "ul"){ fL(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ fP(); if(list !== "ol"){ fL(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; continue; }
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){ fP(); fL(); html += "<hr>"; continue; }
    if(!l.trim()){ fP(); fL(); continue; }
    fL(); para.push(l);
  }
  fP(); fL(); fT(); if(code) html += "</code></pre>";
  return html;
}

const lc = s => String(s || "").trim().toLowerCase();
function contactFor(conv){
  return data.contacts.find(k => k.id === conv.contactId) || data.contacts.find(k => lc(k.name) && lc(k.name) === lc(conv.person));
}
function convsFor(k){
  return data.conversations.filter(c => c.contactId === k.id || (!c.contactId && lc(c.person) === lc(k.name))).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}
function companyOf(k){ return data.companies.find(c => c.id === k.companyId) || data.companies.find(c => lc(c.name) && lc(c.name) === lc(k.company)); }
function companyName(k){ const c = companyOf(k); return c ? c.name : (k.company || ""); }
const telHref = p => "tel:" + String(p).replace(/[^\d+]/g, "");
const webHref = w => /^https?:/i.test(w) ? w : "https://" + w;
function vContacts(){
  const actions = canWrite ? `<button class="btn" data-add="companies">Add company</button><button class="btn" data-add="contacts">Add contact</button><button class="btn primary" data-paste>Paste contact info</button>` : "";
  const header = `<div class="viewhead"><div><h2>Contacts</h2><p>${S.contacts.blurb}</p></div><div class="row">${actions}</div></div>`;
  if(!data.contacts.length && !data.companies.length) return header + `<div class="empty"><h3>No contacts yet</h3><p>Copy someone's email signature, business card text or website contact details and paste it in. The name, company, phone, email and address are filled in for you to check.</p><div class="row">${canWrite ? `<button class="btn primary" data-paste>Paste contact info</button><button class="btn" data-add="contacts">Add contact</button>` : ""}</div></div>`;
  const labels = [...new Set(data.contacts.map(k => k.label).filter(Boolean))].sort();
  const shown = data.contacts.filter(k => filters.contacts === "All" || k.label === filters.contacts);
  const groups = new Map();
  const keyOf = k => { const c = companyOf(k); return c ? "id:" + c.id : (k.company ? "name:" + lc(k.company) : "none"); };
  if(filters.contacts === "All") data.companies.forEach(c => groups.set("id:" + c.id, []));
  shown.forEach(k => { const key = keyOf(k); if(!groups.has(key)) groups.set(key, []); groups.get(key).push(k); });
  const keys = [...groups.keys()].sort((a, b) => a === "none" ? 1 : b === "none" ? -1 : groupTitle(a, groups.get(a)).localeCompare(groupTitle(b, groups.get(b))));
  function groupTitle(key, ks){ if(key === "none") return "No company"; if(key.startsWith("id:")) return (data.companies.find(c => "id:" + c.id === key) || {}).name || ""; return ks[0].company; }
  return header + (labels.length > 1 ? chips("contacts", labels) : "") + keys.map(key => {
    const ks = groups.get(key).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    const co = key.startsWith("id:") ? data.companies.find(c => "id:" + c.id === key) : null;
    const coMeta = co ? [co.label, co.phone && `<a href="${esc(telHref(co.phone))}">${esc(co.phone)}</a>`, co.website && `<a href="${esc(webHref(co.website))}" target="_blank" rel="noopener">${esc(co.website.replace(/^https?:\/\//, ""))}</a>`].filter(Boolean).join(" · ") : "";
    return `<div class="group"><h3>${co && canWrite ? `<button class="btn ghost" style="font:inherit;padding:0;color:var(--ink)" data-edit="companies" data-id="${esc(co.id)}">${esc(co.name)}</button>` : esc(groupTitle(key, ks))} <span class="meta" style="font-family:'Libre Caslon Text',Georgia,serif;font-size:15px;font-weight:400">${coMeta}</span></h3>
      ${ks.length ? `<div class="grid">${ks.map(contactCard).join("")}</div>` : `<p class="meta">No contacts at this company yet.</p>`}</div>`;
  }).join("");
}

const GENERIC_DOMAINS = /^(gmail|googlemail|hotmail|outlook|live|msn|yahoo|ymail|icloud|me|mac|aol|proton|protonmail|rogers|bell|sympatico|shaw|telus|cogeco|videotron|comcast|verizon|att|sbcglobal|gmx|mail|zoho)$/i;
const CO_WORDS = /\b(inc|ltd|llc|llp|corp|corporation|co\.|company|limited|construction|contracting|contractors?|builders?|building|homes|design|designs|interiors|architects?|architecture|engineering|engineers|group|studio|associates|partners|renovations?|plumbing|electric|electrical|mechanical|hvac|roofing|landscaping|supply|supplies|millwork|cabinetry|cabinets|kitchens|windows|doors|flooring|tile|masonry|excavation|surveying|consulting|consultants|enterprises|services|solutions)\b/i;
const TITLE_WORDS = /\b(president|vice|owner|principal|manager|director|founder|co-founder|partner|architect|designer|engineer|estimator|coordinator|project|site|superintendent|foreman|supervisor|sales|associate|lead|senior|junior|consultant|specialist|technician|administrator|assistant|ceo|coo|cfo|vp|p\.?\s?eng|oaa|mraic|arido|bcin)\b/i;
const ADDR_WORDS = /\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|cres|crescent|way|lane|ln|court|ct|crt|pl|place|pkwy|parkway|hwy|highway|terrace|trail|circle|sq|square|unit|suite|ste|po box)\b\.?/i;
const POSTAL = /\b[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z][ -]?\d[ABCEGHJ-NPRSTV-Z]\d\b|\b[A-Z]{2}\s+\d{5}(-\d{4})?\b/i;
const PHONE = /(\+?1[\s.\-]?)?\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}(\s*(x|ext\.?|extension)\s*\d{1,5})?/i;
const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());

function guessLabel(text){
  const t = text.toLowerCase();
  if(/architect|\boaa\b|mraic/.test(t)) return "Architect";
  if(/survey|\bols\b|land information|topograph|boundary/.test(t)) return "Surveyor";
  if(/engineer|p\.?\s?eng|structural/.test(t)) return "Engineer";
  if(/interior|design|arido|decorat/.test(t)) return "Designer";
  if(/inspector|inspection|city of|municipal|building department/.test(t)) return "Inspector";
  if(/mortgage|bank|lender|lending|credit union|financ/.test(t)) return "Lender";
  if(/general contractor|\bgc\b|construction|contracting|builder|renovation|homes\b|project manager|superintendent/.test(t)) return "General contractor";
  if(/plumb|electric|hvac|heating|roofing|drywall|paint|floor|tile|landscap|excavat|framing|mason|concrete|insulation|millwork|cabinet|glass|siding|demolition/.test(t)) return "Subcontractor";
  if(/supply|supplies|supplier|lumber|showroom|distribut|depot|wholesale/.test(t)) return "Supplier";
  return "";
}

function parseContact(text){
  const out = {};
  const raw = String(text || "").replace(/\r/g, "");
  let lines = raw.split("\n")
    .flatMap(l => l.split(/\s+[|•·]\s+|\s{3,}|\t+/))
    .map(l => l.replace(/^[\s>*•\-–—]+/, "").trim())
    .filter(l => l && !/^(sent from my|confidential|this e-?mail|please consider|--+$|_{3,})/i.test(l) && !/^((kind|best|warm)\s+)?(regards|thanks|thank you|best|cheers|sincerely)[,!.]?$/i.test(l));
  const used = new Set();
  const take = i => used.add(i);
  // labelled lines like "Name: Jane"
  lines.forEach((l, i) => {
    const m = l.match(/^(name|company|organization|title|position|role|phone|tel|telephone|office|direct|mobile|cell|email|e-mail|web|website|address)\s*[:\-]\s*(.+)$/i);
    if(!m) return;
    const k = m[1].toLowerCase(), v = m[2].trim();
    if(k === "name" && !out.name){ out.name = v; take(i); }
    else if((k === "company" || k === "organization") && !out.company){ out.company = v; take(i); }
    else if((k === "title" || k === "position" || k === "role") && !out.title){ out.title = v; take(i); }
    else if((k === "address") && !out.address){ out.address = v; take(i); }
  });
  // email
  const em = raw.match(/[\w.+\-]+@[\w\-]+(\.[\w\-]+)+/);
  if(em){ out.email = em[0].toLowerCase(); lines.forEach((l, i) => { if(l.includes(em[0]) && l.replace(/^(e-?mail|email|e)\s*[:.]?\s*/i, "").replace(em[0], "").replace(/[<>()\[\]\s,;]/g, "") === "") take(i); }); }
  // phones
  lines.forEach((l, i) => {
    if(used.has(i)) return;
    const m = l.match(PHONE);
    if(!m || l.replace(m[0], "").replace(/[^a-z]/gi, "").length > 14) return;
    const isMobile = /\b(m|c|cell|mobile|mob)\b\s*[:.]?/i.test(l);
    const isFax = /\bfax|\bf\s*[:.]/i.test(l);
    if(isFax) { take(i); return; }
    const num = m[0].trim();
    if(isMobile && !out.mobile) out.mobile = num;
    else if(!out.phone) out.phone = num;
    else if(!out.mobile) out.mobile = num;
    take(i);
    // a second number on the same line
    const rest = l.replace(m[0], ""); const m2 = rest.match(PHONE);
    if(m2){ if(!out.mobile && out.phone !== m2[0].trim()) out.mobile = m2[0].trim(); }
  });
  // website
  lines.forEach((l, i) => {
    if(used.has(i) || out.website || l.includes("@")) return;
    const m = l.match(/\b((https?:\/\/)?(www\.)?[a-z0-9\-]+(\.[a-z0-9\-]+)*\.(com|ca|net|org|co|io|design|studio|build|construction|homes|biz|us|info)(\/[^\s]*)?)\b/i);
    if(m && l.replace(m[0], "").replace(/^(w|web|website|www)\s*[:.]?\s*/i, "").trim().length < 4){ out.website = m[1].replace(/\/$/, ""); take(i); }
  });
  // address (street line, optionally followed by city/postal line)
  lines.forEach((l, i) => {
    if(used.has(i) || out.address) return;
    const street = /^\d+[a-z]?\s+\S/i.test(l) && ADDR_WORDS.test(l);
    const postal = POSTAL.test(l);
    if(street || postal || /^(unit|suite|ste\.?|po box)\s/i.test(l)){
      let a = l; take(i);
      const nx = lines[i + 1];
      if(nx && !used.has(i + 1) && (POSTAL.test(nx) || /\b(ON|Ontario|QC|BC|AB|MB|SK|NS|NB|NL|PE)\b/.test(nx)) && !street === false){ a += ", " + nx; take(i + 1); }
      out.address = a.replace(/^(a|address)\s*[:.]?\s*/i, "");
    }
  });
  // name with optional credentials, e.g. "Sarah Chen, OAA" or "Dave Patel P.Eng."
  const CRED = /[,\s]+((OAA|MRAIC|FRAIC|P\.?\s?Eng\.?|PMP|ARIDO|BCIN|LEED\s?AP|CPA|CET|PE|AIA|RA|MBA|B\.?\s?Arch|M\.?\s?Arch|Ph\.?D)\.?[,\s]*)+$/i;
  lines.forEach((l, i) => {
    if(used.has(i) || out.name) return;
    const cm = l.match(CRED);
    const base = (cm ? l.slice(0, cm.index) : l).replace(/^(regards|thanks|thank you|best|cheers|sincerely)[,!]?\s*/i, "").trim();
    if(/^[A-ZÀ-Ý][a-zà-ÿ'’\-]+(\s+[A-ZÀ-Ý][A-Za-zà-ÿ'’.\-]*){1,3}$/.test(base) && !TITLE_WORDS.test(base) && !CO_WORDS.test(base)){
      out.name = base; take(i);
      if(cm && !out.credentials) out.credentials = cm[0].replace(/^[,\s]+/, "").trim();
    }
  });
  // title and company lines, possibly "Title at Company" or "Title, Company"
  lines.forEach((l, i) => {
    if(used.has(i)) return;
    const at = l.match(/^(.+?)\s+(?:at|@|with|-|–|—|,)\s+(.+)$/i);
    if(at && TITLE_WORDS.test(at[1]) && !out.title){ out.title = at[1].trim(); if(!out.company) out.company = at[2].trim(); take(i); return; }
    if(CO_WORDS.test(l) && !out.company && !TITLE_WORDS.test(l.replace(CO_WORDS, ""))){ out.company = l; take(i); return; }
    if(TITLE_WORDS.test(l) && !out.title && l.split(/\s+/).length <= 7){ out.title = l; take(i); return; }
  });
  // name: first remaining short line that looks like a person's name
  lines.forEach((l, i) => {
    if(used.has(i) || out.name) return;
    const clean = l.replace(/[,;]+$/, "").replace(/^(regards|thanks|thank you|best|cheers|sincerely)[,!]?\s*/i, "");
    if(!clean) { take(i); return; }
    if(/^[A-Za-zÀ-ÿ'’.\-]+(\s+[A-Za-zÀ-ÿ'’.\-]+){0,3}(,\s*[A-Z.\s]{2,12})?$/.test(clean) && !/\d/.test(clean) && !CO_WORDS.test(clean)){
      out.name = clean.replace(/,\s*[A-Z.\s]{2,12}$/, m => { if(!out.title) out.title = m.replace(/^,\s*/, ""); return ""; }).trim();
      take(i);
    }
  });
  if(out.name && out.name === out.name.toLowerCase()) out.name = titleCase(out.name);
  // company from email domain if still missing
  if(!out.company && out.email){
    const base = out.email.split("@")[1].split(".")[0];
    if(!GENERIC_DOMAINS.test(base)) out.company = titleCase(base.replace(/[-_]+/g, " "));
  }
  if(!out.website && out.email){
    const dom = out.email.split("@")[1];
    if(!GENERIC_DOMAINS.test(dom.split(".")[0])) out.website = dom;
  }
  if(out.credentials){ out.title = out.title ? out.title + ", " + out.credentials : out.credentials; delete out.credentials; }
  out.label = guessLabel([out.title, out.company, out.website, raw].join(" "));
  const leftover = lines.filter((l, i) => !used.has(i) && l !== out.name).join("\n");
  if(leftover) out.notes = leftover;
  return out;
}

async function linkCompany(body){
  const name = String(body.company || "").trim();
  if(!name){ body.companyId = ""; return body; }
  const existing = data.companies.find(c => lc(c.name) === lc(name));
  if(existing){ body.companyId = existing.id; body.company = existing.name; return body; }
  body.companyId = await insertOne("companies", {name, label: body.label || "", phone: "", email: "", website: body.website || "", address: body.address || "", notes: "", files: [], created: Date.now(), updated: Date.now()});
  return body;
}

function datalists(){
