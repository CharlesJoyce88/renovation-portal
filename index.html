    if(f.t === "files"){
      return `<div class="${cls}"><label>${f.l}</label><div class="files" id="fileList"></div>
        ${canWrite ? `<input type="file" id="fileInput" multiple aria-label="${f.l}"><span class="meta" style="font-size:13px">Any file type up to ${MAX_MB} MB each: PDFs, photos, Word, Excel, CAD.</span><span class="uploading" id="upState"></span>` : ""}</div>`;
    }
    const dis = canWrite ? "" : "disabled";
    if(f.t === "textarea") return `<div class="${cls}"><label for="${id}">${f.l}</label><textarea id="${id}" name="${f.k}" ${dis} ${f.big ? 'style="min-height:280px;font-size:15px"' : ""} placeholder="${esc(f.ph || "")}">${esc(v)}</textarea></div>`;
    if(f.t === "ref"){ const opts = f.src(); const val = v || (f.def ? f.def(r) : ""); return `<div class="${cls}"><label for="${id}">${f.l}</label><select id="${id}" name="${f.k}" ${dis}><option value="">${opts.length ? "Not assigned" : "Add budget lines first"}</option>${opts.map(([ov, ol]) => `<option value="${esc(ov)}" ${ov === val ? "selected" : ""}>${esc(ol)}</option>`).join("")}</select></div>`; }
    if(f.t === "select") return `<div class="${cls}"><label for="${id}">${f.l}</label><select id="${id}" name="${f.k}" ${dis}><option value=""></option>${f.o.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
    const type = f.t === "money" || f.t === "number" ? "number" : f.t === "url" ? "url" : f.t === "date" ? "date" : "text";
    const extra = (f.t === "money" ? 'step="0.01" inputmode="decimal"' : f.t === "number" ? `step="any" inputmode="decimal" ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""}` : "") + (f.list ? ` list="dl-${f.list}"` : "");
    return `<div class="${cls}"><label for="${id}">${f.l}${f.req ? "" : ""}</label><input id="${id}" name="${f.k}" type="${type}" value="${esc(v)}" ${f.req ? "required" : ""} placeholder="${esc(f.ph || "")}" ${extra} ${dis}></div>`;
  };
  dlg.innerHTML = `<form method="dialog" id="frm" novalidate>
    <div class="m-head"><h2>${rec ? (canWrite ? "Edit " : "") + sch.one : "New " + sch.one}</h2><button type="button" class="btn ghost" id="xBtn" aria-label="Close">Close</button></div>
    <div class="m-body">${preset && preset.__note ? `<p class="banner f" style="margin:0" id="readNote">${esc(preset.__note)}</p>` : ""}${preset && preset.__fromPaste ? `<p class="banner f" style="margin:0">Check these details. They were filled in from what you pasted, and anything left over is in Notes.</p>` : ""}${sch.fields.map(fieldHTML).join("")}<p class="err f" id="formErr" hidden></p></div>
    ${canWrite ? `<div class="m-foot">${rec && col !== "project" ? `<button type="button" class="btn danger" id="delBtn">Delete</button>` : "<span></span>"}<div class="row"><button type="button" class="btn" id="cancelBtn">Cancel</button><button type="submit" class="btn primary" id="saveBtn">Save ${sch.one}</button></div></div>` : ""}
  </form>${datalists()}`;
  const renderFiles = () => {
    const el = $("#fileList"); if(!el) return;

    el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { files.splice(+b.dataset.rm, 1); renderFiles(); });
  };
  renderFiles();

  const close = () => dlg.close();

            let note = $("#readNote");

            note.textContent = listingNote(L, file.name);
          } catch(e){}
          st.textContent = "";
        }
        if(col === "quotes" && /pdf/i.test(file.type || "") || col === "quotes" && /\.pdf$/i.test(file.name)){
          const amtEl = dlg.querySelector('[name="amount"]');

            st.textContent = "";
            if(q){
              const fill = (k, v) => { const el = dlg.querySelector(`[name="${k}"]`); if(el && !el.value && v !== "" && v != null) el.value = typeof v === "number" ? v.toFixed(2).replace(/\.00$/, "") : v; };
              fill("subtotal", q.subtotal); fill("hst", q.hst); fill("amount", q.amount); fill("deposit", q.deposit); fill("validUntil", q.validUntil); fill("date", q.date); fill("vendor", q.vendor); fill("trade", q.trade);
              let note = $("#readNote");
              if(!note){ note = document.createElement("p"); note.className = "banner f"; note.id = "readNote"; note.style.margin = "0"; dlg.querySelector(".m-body").prepend(note); }
              note.textContent = quoteNote(q, file.name);
            }
          }
        }
      } catch(e){
        st.textContent = /size|large/i.test(e && e.message || "") ? `${file.name} is too large for your Supabase storage limit.` : `${file.name} didn't upload. Try again.`;
      } finally { uploading--; }
    }
    fi.value = "";
  };
  if($("#delBtn")) $("#delBtn").onclick = async () => {
    if(!confirm(`Delete this ${sch.one}? This can't be undone.`)) return;
    try { await remove(col, rec.id); close(); toast(`Deleted ${sch.one}.`); } catch(e){ toast("Couldn't delete. Try again."); }
  };
  $("#frm").onsubmit = async ev => {
    ev.preventDefault();
    if(!canWrite) return close();
    const err = $("#formErr");
    if(uploading){ err.hidden = false; err.textContent = "Wait for uploads to finish before saving."; return; }
    const body = {};
    Object.keys(r).forEach(k => { if(k !== "id" && !k.startsWith("__")) body[k] = r[k]; });
    for(const f of sch.fields){
      if(f.t === "files"){ body.files = files; continue; }
      const el = dlg.querySelector(`[name="${f.k}"]`);
      let v = el.value.trim();
      if(f.req && !v){ err.hidden = false; err.textContent = `${f.l} is required.`; el.focus(); return; }
      if(f.t === "money" || f.t === "number" || f.t === "hst") v = v === "" ? "" : +v;
      body[f.k] = v;
    }
    if(col === "comps") body.needsReview = false;
    if(col === "invoices"){
      body.needsReview = false;
      if(body.holdback === "" && !rec && HOLDBACK_CATS.includes(body.category)) body.holdback = defaultHoldback(body);
      if(body.status === "Paid" && !body.paidDate) body.paidDate = todayISO();
    }
    if(col === "conversations"){
      const k = data.contacts.find(x => lc(x.name) === lc(body.person));
      body.contactId = k ? k.id : "";
      if(k && !body.role) body.role = k.label || "";
    }
    if(col === "tasks" && body.end < body.start){ err.hidden = false; err.textContent = "Finish date must be on or after the start date."; return; }
    if(col === "tasks" && body.progress !== "") body.progress = Math.max(0, Math.min(100, body.progress));
    body.updated = Date.now();
    body.created = r.created || Date.now();
    const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      if(col === "contacts") await linkCompany(body);
      await save(col, rec && rec.id, body); saved = true;
      if(r.__inbox){ const ib = data.inbox.find(x => x.id === r.__inbox.id); if(ib){ await updRec(ib, {files: (ib.files || []).map((x, i) => i === r.__inbox.idx ? {...x, filed: col} : x)}); await loadAll(); } }
      const keep = new Set(files.map(f => f.path));
      removeFiles(original.filter(f => !keep.has(f.path))).catch(() => {});
      close(); toast(`Saved ${sch.one}.`);
    }
    catch(e){ btn.disabled = false; btn.textContent = `Save ${sch.one}`; err.hidden = false;
      err.textContent = e && e.code === "42501" ? "Your account doesn't have permission to change this portal." : "Couldn't save. Check your connection and try again."; }
  };
  dlg.showModal();
}

// ---------- starters ----------
async function starter(kind){
  if(kind === "permits"){
    const rows = [["Building permit","Building permit","Applied for through the City's building department."],
      ["Excavation & footings","Inspection",""],["Foundation & damp-proofing (before backfill)","Inspection",""],["Underground plumbing & drains","Inspection",""],
      ["Framing","Inspection",""],["Plumbing rough-in","Inspection",""],["HVAC rough-in","Inspection",""],
      ["Electrical rough-in (ESA)","Inspection","Electrical inspections are booked with the Electrical Safety Authority (ESA), usually by your licensed electrician, not with the City."],
      ["Insulation & vapour barrier","Inspection",""],["Fire separations (if required)","Inspection",""],
      ["Final plumbing","Inspection",""],["Final HVAC","Inspection",""],["Electrical final (ESA)","Inspection",""],["Final building inspection / occupancy","Inspection",""]];
    if(!confirm(`Add ${rows.length} typical items for an addition in Ontario? Your permit lists the inspections actually required, so edit or delete any that don't apply.`)) return;
    await insertMany("permits", rows.map(([name, type, notes], i) => ({name, type, notes, status: "Not started", permitNumber: "", inspector: "", date: "", resultDate: "", files: [], seq: i, created: Date.now() + i, updated: Date.now()})));
    toast("Inspections added. Tap one to book it or record the result.");
    return;
  }
  if(kind === "tasks"){
    const seq = [["Design & drawings","Design",42],["Structural engineering","Design",21,-14],["Permit review","Permits",42],["Demolition","Site work",7],["Excavation & foundation","Structure",21],["Framing","Structure",28],["Roofing, windows & doors","Envelope",14],["Rough plumbing, electrical & HVAC","Rough-ins",21],["Rough inspections","Inspections",5],["Insulation & drywall","Finishes",21],["Flooring & tile","Finishes",21],["Cabinets & countertops","Finishes",14],["Paint & trim","Finishes",14],["Fixtures & appliances","Finishes",10],["Final inspection & punch list","Closeout",10]];
    let cur = project.start || todayISO();
    const rows = seq.map(([name, phase, len, overlap]) => {
      const start = overlap ? addDays(cur, overlap) : cur;
      const end = addDays(start, len - 1); cur = addDays(end, 1);
      return {name, phase, start, end, progress: 0, owner: "", notes: ""};
    });
    if(!confirm(`Add ${rows.length} typical tasks starting ${fmtDate(rows[0].start)}? You can edit or delete any of them.`)) return;
    await insertMany("tasks", rows.map(x => ({...x, created: Date.now(), updated: Date.now()})));
    toast("Schedule added. Tap any bar to adjust it.");
  } else {
    if(!confirm(`Add ${TRADES.length} standard budget categories with blank amounts?`)) return;
    await insertMany("budget", TRADES.map(c => ({category: c, item: "", budgeted: "", committed: "", paid: "", vendor: "", notes: "", created: Date.now(), updated: Date.now()})));
    toast("Categories added. Tap a row to fill in amounts.");
  }
}

// ---------- events ----------
document.addEventListener("click", e => {
  if(photoSelect && view === "photos"){
    const tile = e.target.closest(".tile[data-pid]");
    if(tile){ e.preventDefault(); const id = tile.dataset.pid; photoPicked.has(id) ? photoPicked.delete(id) : photoPicked.add(id); render(); return; }
  }
  const dp = e.target.closest("[data-delphoto]");
  if(dp){ e.preventDefault(); deletePhotos([dp.dataset.delphoto]).catch(() => toast("Couldn't delete. Try again.")); return; }
  if(e.target.closest("[data-photoselect]")){ photoSelect = !photoSelect; photoPicked.clear(); render(); return; }
  if(e.target.closest("[data-photoselall]")){ document.querySelectorAll("#photoGrid .tile[data-pid]").forEach(t => photoPicked.add(t.dataset.pid)); render(); return; }
  if(e.target.closest("[data-photodelsel]")){ deletePhotos([...photoPicked]).then(() => { if(!photoPicked.size){ photoSelect = false; render(); } }).catch(() => toast("Couldn't delete. Try again.")); return; }
  if(e.target.closest("[data-stop]")) return;
  const v = e.target.closest("[data-view]");
  if(v){ view = v.dataset.view; compareTrade = null; compDetail = null; photoSelect = false; photoPicked.clear(); render(); window.scrollTo(0, 0); return; }
  const cmpB = e.target.closest("[data-compare]");
  if(cmpB){ compareTrade = cmpB.dataset.compare || null; render(); window.scrollTo(0, 0); return; }
  const acc = e.target.closest("[data-accept]");
  if(acc){ acceptQuote(acc.dataset.accept).catch(() => toast("Couldn't save. Try again.")); return; }
  if(e.target.closest("[data-print]")){ window.print(); return; }
  const a = e.target.closest("[data-add]");
  if(a){
    const col = a.dataset.add, preset = {};
    if(col === "tasks"){ preset.start = todayISO(); preset.end = addDays(todayISO(), 6); preset.progress = 0; }
    if(col === "conversations" || col === "quotes" || col === "plans" || col === "changeOrders") preset.date = todayISO();
    if(col === "changeOrders"){ preset.number = "CO-" + String(data.changeOrders.length + 1).padStart(3, "0"); preset.status = "Pending"; }
    if(col === "quotes"){ preset.status = "Received"; if(a.dataset.trade) preset.trade = a.dataset.trade; }
    if(col === "invoices"){ preset.status = "Unpaid"; preset.date = todayISO(); }
    if(col === "permits"){ preset.type = "Inspection"; preset.status = "Not started"; }
    if(col === "selections") preset.status = "To decide";
    if(col === "punch"){ preset.status = "Open"; preset.priority = "Normal"; preset.found = todayISO(); }
    if(col === "comps"){ preset.status = "Sold"; preset.include = "Yes"; }
    if(col === "research"){ preset.date = todayISO(); if(a.dataset.topic) preset.topic = a.dataset.topic; }
    if(col === "photos"){ openPhotoUpload(); return; }
    if(col === "materials") preset.status = "Specified";
    openForm(col, null, preset); return;
  }
  if(e.target.closest("[data-paste]")){ openPaste(); return; }
  if(e.target.closest("[data-export]")){ exportInvoices(); return; }
  if(e.target.closest("[data-photoupload]")){ openPhotoUpload(); return; }
  const cpo = e.target.closest("[data-comp]");
  if(cpo && !e.target.closest("a")){ compDetail = cpo.dataset.comp || null; render(); window.scrollTo(0, 0); return; }
  const cl = e.target.closest("[data-complayout]");
  if(cl){ compLayout = cl.dataset.complayout; render(); return; }
  if(e.target.closest("[data-comppaste]")){ openListingPaste(); return; }
  if(e.target.closest("[data-subject]")){ openForm("subject", data.subject[0] || null, data.subject[0] ? null : {address: project.address || ""}); return; }
  const rp = e.target.closest("[data-renderpdf]");
  if(rp){ renderCompPdfs(rp.dataset.renderpdf).catch(() => toast("Couldn't show the listing pages.")); return; }
  const sp = e.target.closest("[data-savepage]");
  if(sp){ saveRenderedPage(sp).catch(() => toast("Couldn't save that page.")); return; }
  const ck = e.target.closest("[data-compkind]");
  if(ck){ const [cid, ix] = ck.dataset.compkind.split("|"); const c = data.comps.find(x => x.id === cid); if(c){ const files = (c.files || []).map((f, i) => i === +ix ? {...f, kind: compFileKind(f) === "floor" ? "photo" : "floor"} : f); updRec(c, {files}).then(loadAll); } return; }
  const fi2 = e.target.closest("[data-filein]");
  if(fi2){ fileFromInbox(fi2.dataset.filein, +fi2.dataset.idx).catch(() => toast("Couldn't file it. Try again.")); return; }
  const iac = e.target.closest("[data-inboxcomp]");
  if(iac){ openFileAllToComp(iac.dataset.inboxcomp); return; }
  const ic = e.target.closest("[data-inboxconv]");
  if(ic){ inboxToConversation(ic.dataset.inboxconv).catch(() => toast("Couldn't save. Try again.")); return; }
  const idn = e.target.closest("[data-inboxdone]");
  if(idn){ const m = data.inbox.find(x => x.id === idn.dataset.inboxdone); if(m) updRec(m, {status: m.status === "done" ? "new" : "done"}).then(loadAll).catch(() => toast("Couldn't save. Try again.")); return; }
  const idl = e.target.closest("[data-inboxdel]");
  if(idl){ deleteEmail(idl.dataset.inboxdel).catch(() => toast("Couldn't delete. Try again.")); return; }
  const ha = e.target.closest("[data-heldadd]");
  if(ha){ const m = data.inbox.find(x => x.id === ha.dataset.heldadd); if(m){ const parsed = parseContact([m.fromName, m.from].filter(Boolean).join("\n")); openForm("contacts", null, {...parsed, name: m.fromName || parsed.name || "", email: m.from}); } return; }
  const ct = e.target.closest("[data-copytext]");
  if(ct){ (navigator.clipboard ? navigator.clipboard.writeText(ct.dataset.copytext) : Promise.reject()).then(() => toast("Copied."), () => toast("Couldn't copy.")); return; }
  if(e.target.closest("[data-importwarranty]")){ importWarranties().catch(() => toast("Couldn't add them. Try again.")); return; }
  const tm = e.target.closest("[data-tomaterial]");
  if(tm){ selectionToMaterial(tm.dataset.tomaterial).catch(() => toast("Couldn't add it. Try again.")); return; }
  const ad = e.target.closest("[data-adddoc]");
  if(ad){ openForm("documents", null, {company: ad.dataset.adddoc, docType: ad.dataset.doctype || ""}); return; }
  const rd = e.target.closest("[data-read]");
  if(rd && !e.target.closest("a")){ openReader(rd.dataset.read); return; }
  const hs = e.target.closest("[data-hbset]");
  if(hs){ const v = hs.dataset.hbset, rec = data.holdbacks.find(h => lc(h.vendor) === lc(v)); openForm("holdbacks", rec || null, {vendor: v, completionDate: todayISO()}); return; }
  const hr = e.target.closest("[data-hbrelease]");
  if(hr){ openRelease(hr.dataset.hbrelease); return; }
  const mp = e.target.closest("[data-markpaid]");
  if(mp){ const x = data.invoices.find(i => i.id === mp.dataset.markpaid); if(x) openMarkPaid(x); return; }
  const lg = e.target.closest("[data-logconv]");
  if(lg){ const k = data.contacts.find(x => x.id === lg.dataset.logconv); if(k) openForm("conversations", null, {date: todayISO(), person: k.name, role: k.label || "", method: "Phone call"}); return; }
  const cp = e.target.closest("[data-copy]");
  if(cp){
    const k = data.contacts.find(x => x.id === cp.dataset.copy);
    if(k){
      const txt = [k.name, [k.title, companyName(k)].filter(Boolean).join(", "), k.phone && "Phone: " + k.phone, k.mobile && "Mobile: " + k.mobile, k.email, k.website, k.address].filter(Boolean).join("\n");
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Contact details copied."), () => toast("Couldn't copy. Select the text and copy it instead."));
    }
    return;
  }
  const r = e.target.closest("[data-addrev]");
  if(r){ openForm("plans", null, {sheet: r.dataset.addrev, discipline: r.dataset.disc, date: todayISO(), status: "For review"}); return; }
  const ed = e.target.closest("[data-edit]");
  if(ed){ const rec = data[ed.dataset.edit].find(x => x.id === ed.dataset.id); if(rec) openForm(ed.dataset.edit, rec); return; }
  if(e.target.closest("[data-project]")){ openForm("project", Object.keys(project).length ? project : null); return; }
  const st = e.target.closest("[data-starter]");
  if(st){ starter(st.dataset.starter).catch(() => toast("Couldn't add everything. Try again.")); return; }
  const f = e.target.closest("[data-filter]");
  if(f){ filters[f.dataset.filter] = f.dataset.val; render(); }
});
document.addEventListener("input", e => {
  if(e.target.id !== "researchSearch") return;
  const q = lc(e.target.value); let shown = 0;
  document.querySelectorAll("#researchList [data-search]").forEach(c => { const ok = !q || c.dataset.search.includes(q); c.hidden = !ok; if(ok) shown++; });
  document.querySelectorAll("#researchList [data-group]").forEach(g => { g.hidden = !g.querySelector("[data-search]:not([hidden])"); });
  const none = $("#researchNone"); if(none) none.hidden = shown > 0;
});
document.addEventListener("change", e => {
  if(/^fd-/.test(e.target.id || "")){ const fx = document.getElementById("fx-" + e.target.id.slice(3)); if(fx) fx.style.display = e.target.value === "compAdd" ? "" : "none"; return; }
  if(e.target.id === "compUpload"){ const fl = [...e.target.files]; e.target.value = ""; handleCompUpload(fl).catch(() => toast("Something went wrong uploading. Try again.")); return; }
  if(e.target.id === "compSort"){ compSort = e.target.value; render(); return; }
  if(e.target.id === "quoteUpload"){ const fl = [...e.target.files]; e.target.value = ""; handleQuoteUpload(fl).catch(() => toast("Something went wrong uploading. Try again.")); return; }
  if(e.target.id === "navSelect"){ view = e.target.value; compareTrade = null; compDetail = null; photoSelect = false; photoPicked.clear(); render(); window.scrollTo(0, 0); return; }
  if(e.target.id === "invUpload"){ const fl = e.target.files; handleInvoiceUpload(fl).catch(() => toast("Something went wrong uploading. Try again.")); }
});
document.addEventListener("submit", async e => {
  if(e.target.id !== "authForm") return;
  e.preventDefault();
  const email = $("#authEmail").value.trim(), password = $("#authPass").value;
  if(!email || !password) return;
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Signing in…";
  const {error} = await sb.auth.signInWithPassword({email, password});
  btn.disabled = false; btn.textContent = "Sign in";
  if(error){
    authMsg = /invalid/i.test(error.message) ? "That email and password don't match. Check both and try again." :
      /confirm/i.test(error.message) ? "This account isn't confirmed yet. In Supabase, recreate the user with Auto Confirm turned on." :
      "Couldn't sign in: " + error.message;
    $("#authMsg").textContent = authMsg;
  }
});
$("#signOut").onclick = () => sb.auth.signOut();
document.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && e.target.matches('.card[role="button"]')){ e.preventDefault(); e.target.click(); }
});
// Scroll the Gantt to today on first view
new MutationObserver(() => {
  const g = $("#gscroll"), t = g && g.querySelector(".g-today");
  if(g && t && !g.dataset.done){ g.dataset.done = 1; g.scrollLeft = Math.max(0, t.offsetLeft - 80); }
}).observe($("#main"), {childList: true});

init();
})();
